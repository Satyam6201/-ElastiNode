services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elastinode-backend
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9000:9000"
    environment:
      - LB_PORT=8080
      - LB_ADMIN_PORT=8081
      - AUTOSCALER_PORT=9000
      - ADMIN_TOKEN=change-me
      - MIN_SERVERS=2
      - MAX_SERVERS=10
      - NODE_ENV=production
    networks:
      - elastinode-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elastinode-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - elastinode-net

networks:
  elastinode-net:
    driver: bridge
